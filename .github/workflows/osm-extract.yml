# Extracts OpenStreetMap layers needed by the pipeline (military areas, forests)
# for the region in pipeline/config/region.yaml and commits them to data/manual/osm/.
# Runs on GitHub because the Claude Code cloud environment cannot reach Geofabrik.
name: osm-extract

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/osm-extract.yml
      - pipeline/config/region.yaml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin zip
          pip install -q pyyaml

      - name: Download and extract
        run: |
          set -euo pipefail
          mkdir -p work data/manual/osm
          paths=$(python3 -c "import yaml; print(' '.join(yaml.safe_load(open('pipeline/config/region.yaml'))['geofabrik']))")
          inputs=""
          for p in $paths; do
            f="work/$(basename "$p").osm.pbf"
            curl -sSfL --retry 4 -o "$f" "https://download.geofabrik.de/${p}-latest.osm.pbf"
            curl -sSfL --retry 4 -o "$f.md5" "https://download.geofabrik.de/${p}-latest.osm.pbf.md5"
            (cd work && sed "s|  .*|  $(basename "$f")|" "$(basename "$f").md5" | md5sum -c -)
            inputs="$inputs $f"
          done
          osmium merge $inputs -o work/region.osm.pbf --overwrite
          osmium fileinfo -g header.option.osmosis_replication_timestamp work/region.osm.pbf | tee work/timestamp.txt

          osmium tags-filter work/region.osm.pbf a/landuse=military a/military -o work/military.osm.pbf --overwrite
          osmium tags-filter work/region.osm.pbf a/landuse=forest a/natural=wood -o work/forest.osm.pbf --overwrite

          # Relation members pulled in by tags-filter (e.g. water, grassland) are dropped by -where.
          declare -A where=(
            [military]="landuse='military' OR other_tags LIKE '%\"military\"=>%'"
            [forest]="landuse='forest' OR \"natural\"='wood'"
          )
          for layer in military forest; do
            ogr2ogr -f GPKG "work/${layer}.gpkg" "work/${layer}.osm.pbf" multipolygons \
              -t_srs EPSG:2180 -simplify 1 -nln "$layer" -where "${where[$layer]}" \
              -select osm_id,osm_way_id,name,landuse,natural,other_tags
            ogrinfo -so "work/${layer}.gpkg" "$layer" | grep -E "Feature Count"
          done

          rm -f data/manual/osm/*.zip
          (cd work && zip -q -9 ../data/manual/osm/osm_layers.zip military.gpkg forest.gpkg timestamp.txt)
          ls -la data/manual/osm/
          {
            echo "# OpenStreetMap layers (generated by .github/workflows/osm-extract.yml)"
            echo
            echo "Source: Geofabrik extracts: $paths"
            echo "Extracted: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "OSM data: $(cat work/timestamp.txt | tr '\n' ' ')"
            echo
            echo "Contents of osm_layers.zip (GeoPackage, EPSG:2180, simplified 1 m):"
            echo "- military.gpkg: multipolygons with landuse=military or military=*"
            echo "- forest.gpkg: multipolygons with landuse=forest or natural=wood (leaf_type etc. in other_tags)"
            echo
            echo "License: (c) OpenStreetMap contributors, ODbL 1.0."
          } > data/manual/osm/SOURCES.md

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/osm
          git commit -m "Update OSM extract for $(python3 -c "import yaml; print(yaml.safe_load(open('pipeline/config/region.yaml'))['name'])")" || echo "No changes"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
